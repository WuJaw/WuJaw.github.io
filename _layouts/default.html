<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }}{% else %}文章{% endif %}</title>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    /* 亮色模式 — 参照 lsy22 黑白灰极简 */
    --bg:       #ffffff;
    --ink:      #101010;
    --body:     #1f1f1f;
    --muted:    #3f3f3f;
    --quiet:    #626262;
    --line:     #dedede;
    --soft:     #fafafa;
    --accent:   #101010;
    --code-bg:  #f4f4f5;

    /* 字体层级 — 参照 lsy22 */
    --fs-micro:   0.625rem;   /* 10px */
    --fs-caption: 0.6875rem;  /* 11px */
    --fs-meta:    0.75rem;    /* 12px */
    --fs-small:   0.8125rem;  /* 13px */
    --fs-ui:      0.875rem;   /* 14px */
    --fs-body:    0.9375rem;  /* 15px */
    --fs-h3:      1.0625rem;  /* 17px */
    --fs-h2:      1.25rem;    /* 20px */
    --fs-h1:      1.5rem;     /* 24px */
    --fs-title:   2rem;       /* 32px */

    /* 间距 */
    --space-xs:  4px;
    --space-sm:  8px;
    --space-md:  16px;
    --space-lg:  24px;
    --space-xl:  40px;
    --space-2xl: 60px;
    --space-3xl: 80px;

    /* 圆角 */
    --radius: 6px;
  }

  /* ========== 全局基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--body);
    font-size: var(--fs-body);
    line-height: 1.75;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px 40px;
  }

  /* ========== 搜索框 ========== */
  .search-box {
    margin-bottom: var(--space-xl);
  }

  .search-input {
    width: 100%;
    padding: var(--space-sm) var(--space-md);
    font-size: var(--fs-body);
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus {
    border-color: var(--quiet);
  }

  .search-input::placeholder {
    color: var(--quiet);
  }

  .cat-card.hidden,
  .cat-articles li.hidden {
    display: none;
  }

  /* ========== 分类索引页 ========== */
  .category-index {
    display: flex;
    flex-direction: column;
    gap: var(--space-xl);
  }

  .cat-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .cat-card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }

  .cat-name {
    font-size: var(--fs-h3);
    font-weight: 700;
    color: var(--ink);
  }

  .cat-count {
    font-size: var(--fs-meta);
    color: var(--quiet);
  }

  .cat-articles {
    list-style: none;
    padding: var(--space-sm) 0;
  }

  .cat-articles li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: var(--space-sm) var(--space-lg);
  }

  .cat-articles li:hover {
    background: var(--soft);
  }

  .cat-articles a {
    color: var(--body);
    text-decoration: none;
    font-size: var(--fs-body);
    transition: color 0.15s;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-articles a:hover {
    color: var(--ink);
  }

  .cat-date {
    color: var(--quiet);
    font-size: var(--fs-meta);
    flex-shrink: 0;
    margin-left: var(--space-md);
  }

  /* ========== 文章详情页 ========== */
  .post-header {
    margin-bottom: var(--space-xl);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--line);
  }

  .post-header h1 {
    font-size: var(--fs-title);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: var(--space-sm);
  }

  .post-header .post-meta {
    color: var(--quiet);
    font-size: var(--fs-small);
  }

  /* ========== 文章正文 ========== */
  .post-content {
    font-size: var(--fs-body);
  }

  .post-content h1,
  .post-content h2,
  .post-content h3,
  .post-content h4 {
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
  }

  .post-content h1 { font-size: var(--fs-h1); margin: 2rem 0 0.75rem; }
  .post-content h2 { font-size: var(--fs-h2); margin: 1.75rem 0 0.6rem; }
  .post-content h3 { font-size: var(--fs-h3); margin: 1.5rem 0 0.5rem; }
  .post-content h4 { font-size: var(--fs-body); margin: 1.25rem 0 0.5rem; }

  .post-content p {
    margin-bottom: 1rem;
  }

  .post-content ul,
  .post-content ol {
    margin: 0.5rem 0 1rem 1.5rem;
  }

  .post-content li {
    margin-bottom: 0.25rem;
  }

  .post-content li::marker {
    color: var(--quiet);
  }

  .post-content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--body);
  }

  /* ========== 代码块 ========== */
  .post-content div.highlighter-rouge {
    margin: 1rem 0;
  }

  .post-content div.highlight {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow-x: auto;
  }

  .post-content pre.highlight {
    background: transparent;
    padding: var(--space-md);
    margin: 0;
    border: none;
    border-radius: 0;
  }

  .post-content pre {
    background: var(--code-bg);
    padding: var(--space-md);
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 1rem 0;
    border: 1px solid var(--line);
  }

  .post-content pre code {
    background: none;
    padding: 0;
    font-size: var(--fs-small);
    border: none;
    line-height: 1.6;
  }

  /* 代码块 — 复制按钮容器 */
  .post-content .highlight,
  .post-content pre:not(.highlight) {
    position: relative;
  }

  /* ========== 代码块复制按钮 ========== */
  .copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: inherit;
    line-height: 1.6;
    color: var(--quiet);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    z-index: 1;
  }

  .highlight:hover .copy-btn,
  pre:hover .copy-btn,
  .copy-btn:focus {
    opacity: 1;
  }

  .copy-btn:hover {
    color: var(--ink);
    border-color: var(--quiet);
  }

  .copy-btn.copied {
    color: #718c00;
    border-color: #718c00;
  }

  /* ========== Rouge 语法高亮 ========== */
  .highlight .c   { color: #8e908c; font-style: italic; } /* 注释 */
  .highlight .cm  { color: #8e908c; font-style: italic; }
  .highlight .cp  { color: #8e908c; font-style: italic; }
  .highlight .c1  { color: #8e908c; font-style: italic; }
  .highlight .cs  { color: #8e908c; font-style: italic; }
  .highlight .err { color: #c82829; }                       /* 错误 */
  .highlight .k   { color: #8959a8; font-weight: 600; }     /* 关键字 */
  .highlight .kd  { color: #8959a8; font-weight: 600; }
  .highlight .kn  { color: #8959a8; font-weight: 600; }
  .highlight .kp  { color: #8959a8; }
  .highlight .kr  { color: #8959a8; font-weight: 600; }
  .highlight .kt  { color: #8959a8; }
  .highlight .kc  { color: #c82829; }                       /* 常量 */
  .highlight .o   { color: #3e999f; }                       /* 操作符 */
  .highlight .ow  { color: #3e999f; }
  .highlight .s   { color: #718c00; }                       /* 字符串 */
  .highlight .sb  { color: #718c00; }
  .highlight .sc  { color: #718c00; }
  .highlight .sd  { color: #718c00; }
  .highlight .s2  { color: #718c00; }
  .highlight .se  { color: #718c00; }
  .highlight .sh  { color: #718c00; }
  .highlight .si  { color: #718c00; }
  .highlight .sx  { color: #718c00; }
  .highlight .sr  { color: #718c00; }
  .highlight .s1  { color: #718c00; }
  .highlight .ss  { color: #718c00; }
  .highlight .m   { color: #f5871f; }                       /* 数字 */
  .highlight .mf  { color: #f5871f; }
  .highlight .mh  { color: #f5871f; }
  .highlight .mi  { color: #f5871f; }
  .highlight .mo  { color: #f5871f; }
  .highlight .il  { color: #f5871f; }
  .highlight .n   { color: #4d4d4c; }                       /* 名称 */
  .highlight .na  { color: #4d4d4c; }
  .highlight .nb  { color: #4d4d4c; }
  .highlight .nc  { color: #c82829; font-weight: 600; }     /* 类名 */
  .highlight .no  { color: #c82829; }
  .highlight .nd  { color: #3e999f; }
  .highlight .ne  { color: #c82829; }
  .highlight .nf  { color: #4271ae; }                       /* 函数名 */
  .highlight .nx  { color: #4d4d4c; }
  .highlight .nt  { color: #8959a8; }                       /* 标签 */
  .highlight .nv  { color: #c82829; }                       /* 变量 */
  .highlight .vc  { color: #c82829; }
  .highlight .vg  { color: #c82829; }
  .highlight .vi  { color: #c82829; }
  .highlight .gh  { color: #4d4d4c; font-weight: 600; }     /* 标题 */
  .highlight .gu  { color: #8e908c; }
  .highlight .gd  { color: #c82829; }                       /* diff */
  .highlight .gi  { color: #718c00; }
  .highlight .gr  { color: #c82829; }
  .highlight .gs  { font-weight: 600; }

  .post-content blockquote {
    border-left: 3px solid var(--line);
    padding-left: 1rem;
    color: var(--muted);
    margin: 1rem 0;
    font-style: italic;
  }

  .post-content img {
    max-width: 100%;
    border-radius: var(--radius);
    margin: 1rem 0;
  }

  .post-content hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2rem 0;
  }

  .post-content a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .post-content a:hover {
    opacity: 0.7;
  }

  .post-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: var(--fs-small);
  }

  .post-content th,
  .post-content td {
    border: 1px solid var(--line);
    padding: var(--space-sm) var(--space-md);
    text-align: left;
  }

  .post-content th {
    background: var(--soft);
    font-weight: 600;
    color: var(--ink);
  }

  /* ========== 文章大纲 TOC ========== */
  .toc-panel {
    position: fixed;
    top: 60px;
    /* 定位到正文左侧 20px 处 */
    right: calc(50% + 470px);
    width: 200px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    font-size: var(--fs-small);
    line-height: 1.6;
    /* 细滚动条 */
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  .toc-panel::-webkit-scrollbar { width: 3px; }
  .toc-panel::-webkit-scrollbar-track { background: transparent; }
  .toc-panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

  .toc-title {
    font-size: var(--fs-meta);
    font-weight: 700;
    color: var(--quiet);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  .toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .toc-list li {
    margin: 0;
    padding: 0;
  }

  .toc-list a {
    display: block;
    padding: 3px 0 3px 0;
    color: var(--quiet);
    text-decoration: none;
    transition: color 0.15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toc-list a:hover {
    color: var(--ink);
  }

  /* h3 缩进 */
  .toc-list .toc-h3 > a {
    padding-left: 12px;
    font-size: var(--fs-meta);
  }

  /* 当前激活项 */
  .toc-list a.active {
    color: var(--ink);
    font-weight: 600;
  }

  /* 只在足够宽的屏幕上显示 TOC（正文 720px + 两侧各需 ~220px） */
  @media (max-width: 1340px) {
    .toc-panel { display: none; }
  }

  /* ========== 响应式 ========== */
  @media (max-width: 600px) {
    body {
      padding: 40px 16px 30px;
    }

    .post-header h1 {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>

{{ content }}

</body>
</html>
