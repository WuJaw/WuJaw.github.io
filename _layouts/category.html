---
layout: default
---
{% assign cat_posts = site.categories[page.cat_name] | sort: "date" | reverse %}

<div class="post-header">
  <h1>{{ page.cat_name }}</h1>
  <span class="post-meta">{{ cat_posts | size }} 篇文章</span>
</div>

<div class="category-index">
  <div class="cat-card">
    <ul class="cat-articles">
      {% for post in cat_posts %}
      <li>
        <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
        <span class="cat-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>

<div style="margin-top:var(--space-xl);text-align:right;">
  <a href="{{ site.baseurl }}/" class="btn">← 全部文章</a>
</div>
