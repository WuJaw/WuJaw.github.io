<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | Wu-X{% else %}Wu-X{% endif %}</title>
<style>
  /* ========== 设计令牌 ========== */
  :root {
    /* 亮色模式 — 参照 lsy22 黑白灰极简 */
    --bg:       #ffffff;
    --ink:      #101010;
    --body:     #1f1f1f;
    --muted:    #3f3f3f;
    --quiet:    #626262;
    --line:     #dedede;
    --soft:     #fafafa;
    --accent:   #101010;
    --code-bg:  #f4f4f5;

    /* 字体层级 — 参照 lsy22 */
    --fs-micro:   0.625rem;   /* 10px */
    --fs-caption: 0.6875rem;  /* 11px */
    --fs-meta:    0.75rem;    /* 12px */
    --fs-small:   0.8125rem;  /* 13px */
    --fs-ui:      0.875rem;   /* 14px */
    --fs-body:    0.9375rem;  /* 15px */
    --fs-h3:      1.0625rem;  /* 17px */
    --fs-h2:      1.25rem;    /* 20px */
    --fs-h1:      1.5rem;     /* 24px */
    --fs-title:   2rem;       /* 32px */

    /* 间距 */
    --space-xs:  4px;
    --space-sm:  8px;
    --space-md:  16px;
    --space-lg:  24px;
    --space-xl:  40px;
    --space-2xl: 60px;
    --space-3xl: 80px;

    /* 圆角 */
    --radius: 6px;
  }

  /* 暗色模式 */
  [data-theme="dark"] {
    --bg:       #111315;
    --ink:      #e6e6e6;
    --body:     #c9cdd1;
    --muted:    #8b949e;
    --quiet:    #6e7681;
    --line:     #30363d;
    --soft:     #15181c;
    --accent:   #e6e6e6;
    --code-bg:  #1c1f24;
  }

  /* ========== 全局基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--body);
    font-size: var(--fs-body);
    line-height: 1.75;
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 20px 40px;
    transition: background 0.3s, color 0.3s;
  }

  /* ========== 页头 ========== */
  .site-header {
    text-align: center;
    margin-bottom: var(--space-2xl);
  }

  .site-header .logo {
    font-size: var(--fs-title);
    font-weight: 800;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: 1px;
  }

  .site-header .logo:hover {
    opacity: 0.75;
  }

  .site-header .tagline {
    color: var(--quiet);
    font-size: var(--fs-ui);
    margin-top: var(--space-sm);
    font-weight: 400;
  }

  /* ========== 导航栏 ========== */
  .site-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-lg);
    margin-bottom: var(--space-3xl);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--line);
  }

  .site-nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: var(--fs-ui);
    font-weight: 500;
    transition: color 0.15s;
  }

  .site-nav a:hover,
  .site-nav a.active {
    color: var(--ink);
  }

  /* 主题切换按钮 */
  .theme-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: var(--space-sm);
  }

  .theme-toggle:hover {
    border-color: var(--quiet);
    color: var(--ink);
    background: var(--soft);
  }

  /* ========== 首页文章列表 ========== */
  .post-list {
    list-style: none;
  }

  .post-item {
    padding: var(--space-md) 0;
    border-bottom: 1px solid var(--line);
  }

  .post-item:last-child {
    border-bottom: none;
  }

  .post-item a {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .post-item a:hover {
    opacity: 0.7;
  }

  .post-item .date {
    display: block;
    color: var(--quiet);
    font-size: var(--fs-meta);
    margin-top: 2px;
  }

  /* ========== 分类索引页 ========== */
  .category-index {
    display: flex;
    flex-direction: column;
    gap: var(--space-xl);
  }

  .cat-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .cat-card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: var(--space-md) var(--space-lg);
    background: var(--soft);
    border-bottom: 1px solid var(--line);
  }

  .cat-name {
    font-size: var(--fs-h3);
    font-weight: 700;
    color: var(--ink);
  }

  .cat-count {
    font-size: var(--fs-meta);
    color: var(--quiet);
  }

  .cat-articles {
    list-style: none;
    padding: var(--space-sm) 0;
  }

  .cat-articles li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: var(--space-sm) var(--space-lg);
  }

  .cat-articles li:hover {
    background: var(--soft);
  }

  .cat-articles a {
    color: var(--body);
    text-decoration: none;
    font-size: var(--fs-body);
    transition: color 0.15s;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-articles a:hover {
    color: var(--ink);
  }

  .cat-date {
    color: var(--quiet);
    font-size: var(--fs-meta);
    flex-shrink: 0;
    margin-left: var(--space-md);
  }

  /* ========== 文章详情页 ========== */
  .post-header {
    margin-bottom: var(--space-xl);
    padding-bottom: var(--space-lg);
    border-bottom: 1px solid var(--line);
  }

  .post-header h1 {
    font-size: var(--fs-title);
    font-weight: 800;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: var(--space-sm);
  }

  .post-header .post-meta {
    color: var(--quiet);
    font-size: var(--fs-small);
  }

  /* ========== 文章正文 ========== */
  .post-content {
    font-size: var(--fs-body);
  }

  .post-content h1,
  .post-content h2,
  .post-content h3,
  .post-content h4 {
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
  }

  .post-content h1 { font-size: var(--fs-h1); margin: 2rem 0 0.75rem; }
  .post-content h2 { font-size: var(--fs-h2); margin: 1.75rem 0 0.6rem; }
  .post-content h3 { font-size: var(--fs-h3); margin: 1.5rem 0 0.5rem; }
  .post-content h4 { font-size: var(--fs-body); margin: 1.25rem 0 0.5rem; }

  .post-content p {
    margin-bottom: 1rem;
  }

  .post-content ul,
  .post-content ol {
    margin: 0.5rem 0 1rem 1.5rem;
  }

  .post-content li {
    margin-bottom: 0.25rem;
  }

  .post-content li::marker {
    color: var(--quiet);
  }

  .post-content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace;
    color: var(--body);
  }

  .post-content pre {
    background: var(--code-bg);
    padding: var(--space-md);
    border-radius: var(--radius);
    overflow-x: auto;
    margin: 1rem 0;
    border: 1px solid var(--line);
  }

  .post-content pre code {
    background: none;
    padding: 0;
    font-size: var(--fs-small);
    border: none;
  }

  .post-content blockquote {
    border-left: 3px solid var(--line);
    padding-left: 1rem;
    color: var(--muted);
    margin: 1rem 0;
    font-style: italic;
  }

  .post-content img {
    max-width: 100%;
    border-radius: var(--radius);
    margin: 1rem 0;
  }

  .post-content hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2rem 0;
  }

  .post-content a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .post-content a:hover {
    opacity: 0.7;
  }

  .post-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: var(--fs-small);
  }

  .post-content th,
  .post-content td {
    border: 1px solid var(--line);
    padding: var(--space-sm) var(--space-md);
    text-align: left;
  }

  .post-content th {
    background: var(--soft);
    font-weight: 600;
    color: var(--ink);
  }

  /* ========== 关于页 ========== */
  .about-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    margin: 0 auto var(--space-lg);
    border: 2px solid var(--line);
  }

  .about-name {
    font-size: var(--fs-title);
    font-weight: 800;
    color: var(--ink);
    text-align: center;
    margin-bottom: var(--space-xl);
  }

  .content {
    font-size: var(--fs-body);
  }

  .content p {
    margin-bottom: var(--space-md);
  }

  /* ========== 页脚 ========== */
  .site-footer {
    margin-top: var(--space-3xl);
    padding-top: var(--space-lg);
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--quiet);
    font-size: var(--fs-meta);
  }

  /* ========== 响应式 ========== */
  @media (max-width: 600px) {
    body {
      padding: 40px 16px 30px;
    }

    .post-header h1 {
      font-size: 1.5rem;
    }

    .site-nav {
      gap: var(--space-md);
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="{{ site.baseurl }}/" class="logo">Wu-X</a>
  <p class="tagline">just as well</p>
</header>

<nav class="site-nav">
  <button class="theme-toggle" id="theme-toggle" aria-label="切换主题" title="切换亮色 / 暗色模式">🌙</button>
</nav>

{{ content }}

<footer class="site-footer">
  &copy; {{ site.time | date: "%Y" }} Wu-X
</footer>

<script>
(function() {
  var toggle = document.getElementById('theme-toggle');
  var html = document.documentElement;

  // 读取保存的主题，否则跟随系统
  var saved = localStorage.getItem('theme');
  if (saved) {
    html.setAttribute('data-theme', saved);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    html.setAttribute('data-theme', 'dark');
  }

  // 更新按钮图标
  function updateIcon() {
    toggle.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  updateIcon();

  // 点击切换
  toggle.addEventListener('click', function() {
    var current = html.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcon();
  });

  // 监听系统主题变化（仅在用户未手动设置时）
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (!localStorage.getItem('theme')) {
      html.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      updateIcon();
    }
  });
})();
</script>

</body>
</html>
