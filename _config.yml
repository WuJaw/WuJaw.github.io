title: Wu-X
description: just as well
baseurl: ""
url: "https://wujaw.github.io"

theme: jekyll-theme-primer

# Markdown 渲染
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 文章 URL 格式：/posts/文章标题/
permalink: /posts/:title/

# 功能开关 — 设为 false 即隐藏对应模块
features:
  search:        true   # 首页搜索框
  site_nav:      true   # 左侧站点目录（分类+文章列表）
  toc:           true   # 右侧文章大纲（TOC）
  copy_button:   true   # 代码块复制按钮

# 私密分类 — 列在此处的分类需要输入暗号解锁后才显示
secret_categories:
  - 编程
  - 博客
  
  

# 排除不需要编译的文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# 插件（GitHub Pages 支持）
plugins:
  - jekyll-feed
