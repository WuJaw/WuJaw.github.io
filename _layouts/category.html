---
layout: default
---
{% assign cat_name = page.category %}
{% assign cat_posts = site.categories[cat_name] | sort: "date" | reverse %}

<div class="cat-archive-header">
  <a class="back-link" href="{{ site.baseurl }}/">← 全部文章</a>
  <div class="cat-archive-title">
    <span class="cat-archive-name">{{ cat_name }}</span>
    <span class="cat-archive-count">{{ cat_posts | size }} 篇</span>
  </div>
</div>

<ul class="cat-archive-list">
  {% for post in cat_posts %}
  <li>
    <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
    <span class="cat-date">{{ post.date | date: "%Y-%m-%d" }}</span>
  </li>
  {% endfor %}
</ul>

<style>
  .cat-archive-header {
    margin-bottom: var(--space-xl);
  }

  .back-link {
    display: inline-block;
    font-size: var(--fs-small);
    color: var(--quiet);
    text-decoration: none;
    margin-bottom: var(--space-md);
    transition: color 0.15s;
  }

  .back-link:hover {
    color: var(--ink);
  }

  .cat-archive-title {
    display: flex;
    align-items: baseline;
    gap: var(--space-md);
    padding-bottom: var(--space-md);
    border-bottom: 2px solid var(--ink);
  }

  .cat-archive-name {
    font-size: var(--fs-h1);
    font-weight: 800;
    color: var(--ink);
  }

  .cat-archive-count {
    font-size: var(--fs-meta);
    color: var(--quiet);
  }

  .cat-archive-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .cat-archive-list li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: var(--space-sm) 0;
    border-bottom: 1px solid var(--line);
  }

  .cat-archive-list li:last-child {
    border-bottom: none;
  }

  .cat-archive-list a {
    color: var(--body);
    text-decoration: none;
    font-size: var(--fs-body);
    transition: color 0.15s;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-archive-list a:hover {
    color: var(--ink);
  }
</style>
